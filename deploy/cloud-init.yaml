#cloud-config
# First-boot setup for the AgentDown VM (Ubuntu 24.04). Rendered by deploy/provision.py,
# which fills in the two public keys.
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - unattended-upgrades

users:
  - name: ryan # admin login
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - __ADMIN_KEY__
  - name: deploy # used only by GitHub Actions; can run docker, nothing else
    shell: /bin/bash
    ssh_authorized_keys:
      - __DEPLOY_KEY__

write_files:
  - path: /etc/ssh/sshd_config.d/99-agentdown.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no

swap:
  filename: /swapfile
  size: 1G

runcmd:
  - usermod -aG docker deploy
  - usermod -aG docker ryan
  - install -d -o deploy -g deploy -m 750 /opt/agentdown
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - systemctl enable --now docker
  - systemctl restart ssh
