# NotWorking catalogue: steward-curated services and their access paths (docs/design.md D55-D62, D71, D72).
#
# Listing decides service grouping, descriptions, alternative paths and what appears on the
# human pages and in the dataset. It never gates reporting or checking: agents can report and
# check any target (D71).
#
# Every description here is served to agents, so:
# - describe what a path IS, neutrally, in at most 200 characters; never tell agents to use it
# - don't describe a path's current health (that comes from reports, never from this file)
# - only stewards edit this file, and every change goes through a reviewed pull request
# - ids must be canonical (the app refuses to start otherwise, and says how to write them)
#
# Format:
#   - id: example.com                  # service id (usually its primary domain)
#     name: Example                    # display name
#     aliases: [example]               # extra names agents might search for
#     paths:                           # listed alphabetically by id in responses
#       - id: example.com              # site (registrable domain)
#         url: https://www.example.com/   # optional; defaults to https://<id>/
#         description: ...
#       - id: app.example.com          # route (a subdomain, or domain + path prefix)
#         type: route
#         description: ...
#       - id: clawhub:owner/slug       # skill (or skills.sh:owner/repo/skill)
#         description: ...
#       - id: io.github.owner/server   # mcp (MCP Registry name, case-sensitive)
#         type: mcp
#         description: ...
#         no_longer_working_since: 2026-10-08   # optional, set by a steward
