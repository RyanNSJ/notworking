[project]
name = "agentdown"
version = "0.1.2"
description = "Downdetector for AI agents: is it just me, or everyone?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "mcp>=2.3",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "tldextract>=5.3",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
agentdown = "agentdown.cli:main"

[dependency-groups]
canary = [
    "curl-cffi>=0.7",
]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.120",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdown"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
